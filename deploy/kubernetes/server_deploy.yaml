apiVersion: apps/v1
kind: Deployment
metadata:
  name: reasonborn-server
  labels:
    app: reasonborn
    hardware: nvidia-t4
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reasonborn
  template:
    metadata:
      labels:
        app: reasonborn
        hardware: nvidia-t4
    spec:
      # Target NVIDIA GPU nodes
      nodeSelector:
        accelerator: nvidia-t4
      tolerations:
      - key: "nvidia.com/gpu"
        operator: "Exists"
        effect: "NoSchedule"
      containers:
      - name: reasonborn
        image: reasonborn-cuda:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        resources:
          limits:
            nvidia.com/gpu: 2
            memory: "40Gi"
            cpu: "8"
          requests:
            nvidia.com/gpu: 2
            memory: "32Gi"
            cpu: "4"
        env:
        - name: CUDA_VISIBLE_DEVICES
          value: "0,1"
        - name: PYTORCH_CUDA_ALLOC_CONF
          value: "expandable_segments:True"
        volumeMounts:
        - name: model-storage
          mountPath: /workspace/models
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 30
      volumes:
      - name: model-storage
        persistentVolumeClaim:
          claimName: reasonborn-models
