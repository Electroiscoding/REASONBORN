num_epochs: 1
sequence_length: 128
gradient_clipping: 1.0

d_model: 64
num_heads: 4
num_layers: 2
vocab_size: 50000
moe_expert_layers: [1]
num_experts: 4
top_k: 2
intermediate_size: 128
load_balance_loss_weight: 0.01

batch_size: 2
gradient_accumulation_steps: 1

optimizer:
  type: "adamw"
  learning_rate: 3.0e-4

lr_scheduler:
  type: "cosine_with_warmup"
  warmup_steps: 10
  max_steps: 100
  min_lr: 3.0e-5
