# ============================================================================
# ReasonBorn Pre-training Configuration — Optimized for NVIDIA T4 (Kaggle)
# Target: Dual NVIDIA T4 (16 GB VRAM each, Turing architecture)
# Precision: FP16 (Turing Tensor Cores)
# ============================================================================

num_epochs: 1
sequence_length: 2048
gradient_clipping: 1.0

# --- Batch Size (tuned for 16GB VRAM per T4) ---
# Single T4 can fit ~128 batch with fp16 for a 500M param model
batch_size: 128
gradient_accumulation_steps: 4
# 2x T4: 128 * 4 * 2 = 1024 effective batch
effective_batch_size: 1024

optimizer:
  type: "adamw"
  learning_rate: 3.0e-4
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.1
  eps: 1.0e-8

lr_scheduler:
  type: "cosine_with_warmup"
  warmup_steps: 4000
  max_steps: 500000
  min_lr: 3.0e-5

# FP16 is natively supported on T4 (Turing Tensor Cores)
mixed_precision: "fp16"

loss_weights:
  mlm: 1.0
  contrastive: 0.1
  verification: 0.05

# --- CUDA-specific ---
cuda:
  attn_implementation: "sdpa"
