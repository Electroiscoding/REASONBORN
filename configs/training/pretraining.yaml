# ============================================================================
# ReasonBorn Pre-training Configuration — Optimized for AMD MI300X (192GB)
# Target: 8x AMD Instinct MI300X (192GB HBM3 each, CDNA3 architecture)
# Precision: BF16 (Native CDNA3 Matrix Cores)
# ============================================================================

num_epochs: 1
sequence_length: 8192  # 4x larger context, made possible by 192GB VRAM
gradient_clipping: 1.0

# --- Batch Size (tuned for 192GB VRAM per MI300X) ---
# MI300X can comfortably fit an enormous batch size in bf16
batch_size: 2
gradient_accumulation_steps: 128
effective_batch_size: 256 # 2 * 128

optimizer:
  type: "adamw"
  learning_rate: 3.0e-4
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.1
  eps: 1.0e-8

lr_scheduler:
  type: "cosine_with_warmup"
  warmup_steps: 4000
  max_steps: 500000
  min_lr: 3.0e-5

# BF16 is natively supported by CDNA3 Matrix Cores, without GradScaler needed
mixed_precision: "bf16"

loss_weights:
  mlm: 1.0
  contrastive: 0.1
  verification: 0.05

# --- ROCm-specific ---
rocm:
  attn_implementation: "flash_attention_2"
