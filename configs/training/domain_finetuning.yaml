# ============================================================================
# ReasonBorn Domain Fine-tuning Configuration — Optimized for NVIDIA T4 (Kaggle)
# Target: Dual NVIDIA T4 (16 GB VRAM each)
# Precision: FP16 (Turing Tensor Cores)
# ============================================================================

num_epochs: 3
sequence_length: 2048

# --- Batch Size (tuned for 16GB VRAM, finetuning uses more memory per sample) ---
batch_size: 64

optimizer:
  type: "adamw"
  learning_rate: 1.0e-5
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.1

lr_scheduler:
  type: "linear_with_warmup"
  warmup_ratio: 0.1

curriculum_learning:
  enabled: true
  difficulty_metrics:
    - length
    - reasoning_depth
    - prerequisite_count
  num_stages: 5

loss_weights:
  task_loss: 1.0
  reasoning_loss: 0.5
  retrieval_loss: 0.3

# --- CUDA-specific ---
cuda:
  attn_implementation: "sdpa"
  mixed_precision: "fp16"
